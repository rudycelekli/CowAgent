name: Windows Bash Streaming Tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "agent/tools/bash/bash.py"
      - "tests/test_bash_streaming.py"
      - ".github/workflows/test-windows-bash.yml"
permissions:
  contents: read
env:
  APP_SHA: 5730af6caca75a3d36da291c97cb2ba15ee93485
  BASE_SHA: c8b1dd8c148c4d49449a69965f35977866110cbb
  CI_SHA: ${{ github.sha }}
defaults:
  run:
    shell: bash
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: "3.11", mode: test}
          - {python: "3.13", mode: test}
          - {python: "3.12", mode: lint}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5730af6caca75a3d36da291c97cb2ba15ee93485
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify application identity
        run: |
          VERIFY_DIR="$RUNNER_TEMP/env-reload-verification"
          mkdir -p "$VERIFY_DIR"
          echo "VERIFY_DIR=$VERIFY_DIR" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$APP_SHA"
          test "$(git rev-parse "$CI_SHA^")" = "$APP_SHA"
          git diff --exit-code "$APP_SHA" "$CI_SHA" -- . ':(exclude).github/workflows/test-windows-bash.yml'
          printf 'application=%s\nvalidation=%s\nbase=%s\ntree=%s\n' "$APP_SHA" "$CI_SHA" "$BASE_SHA" "$(git rev-parse HEAD^{tree})" > "$VERIFY_DIR/identity.txt"
          sha256sum agent/tools/env_config/env_config.py tests/test_env_config_dotenv_reload.py requirements.txt > "$VERIFY_DIR/application.sha256"
      - name: Install upstream test dependencies
        if: matrix.mode == 'test'
        run: |
          python --version | tee "$VERIFY_DIR/python-version.txt"
          python -m pip install --upgrade pip 2>&1 | tee "$VERIFY_DIR/pip-upgrade.log"
          python -m pip install pytest 2>&1 | tee "$VERIFY_DIR/pytest-install.log"
          python -m pip install -r requirements.txt 2>&1 | tee "$VERIFY_DIR/requirements-install.log"
      - name: Prove intended baseline failures
        if: matrix.mode == 'test'
        run: |
          restore() { git checkout "$APP_SHA" -- agent/tools/env_config/env_config.py; }
          trap restore EXIT
          git show "$BASE_SHA:agent/tools/env_config/env_config.py" > agent/tools/env_config/env_config.py
          set +e
          python -m pytest tests/test_env_config_dotenv_reload.py -q --junitxml="$VERIFY_DIR/baseline.xml" > "$VERIFY_DIR/baseline.log" 2>&1
          result=$?
          set -e
          cat "$VERIFY_DIR/baseline.log"
          test "$result" = 1
          python - <<'PY' | tee "$VERIFY_DIR/baseline-classified.txt"
          import os
          import xml.etree.ElementTree as ET
          root = ET.parse(os.path.join(os.environ["VERIFY_DIR"], "baseline.xml")).getroot()
          failures = {
              "test_public_set_keeps_startup_dotenv_value[double-quoted]",
              "test_public_set_keeps_startup_dotenv_value[single-quoted]",
              "test_public_set_keeps_startup_dotenv_value[inline-comment]",
              "test_public_set_keeps_startup_dotenv_value[escaped-backslash]",
              "test_public_set_keeps_startup_dotenv_value[expansion]",
          }
          control = "test_public_set_keeps_startup_dotenv_value[plain-control]"
          cases = root.findall(".//testcase")
          assert len(cases) == 6, "Expected exactly six cases"
          assert {case.attrib["name"] for case in cases} == failures | {control}
          assert not root.findall(".//error"), "Infrastructure errors are not a baseline"
          assert not root.findall(".//skipped"), "All six Linux cases must execute"
          for case in cases:
              nodes = case.findall("failure")
              if case.attrib["name"] in failures:
                  assert len(nodes) == 1, ET.tostring(case)
                  assert nodes[0].attrib.get("message", "").startswith(("assert ", "AssertionError: assert ")), ET.tostring(case)
                  assert (nodes[0].text or "").rstrip().endswith("tests/test_env_config_dotenv_reload.py:43: AssertionError"), ET.tostring(case)
              else:
                  assert not nodes, "Unchanged control must pass"
          print("Exactly five intended AssertionErrors and one passing control; zero errors/skips.")
          PY
          restore
          trap - EXIT
          sha256sum -c "$VERIFY_DIR/application.sha256"
          git diff --exit-code "$APP_SHA" -- .
      - name: Run required whole backend suite
        if: matrix.mode == 'test'
        run: python -m pytest tests/ -q 2>&1 | tee "$VERIFY_DIR/full-suite.log"
      - name: Install upstream lint dependency
        if: matrix.mode == 'lint'
        run: python -m pip install ruff 2>&1 | tee "$VERIFY_DIR/ruff-install.log"
      - name: Run required changed-file F gate
        if: matrix.mode == 'lint'
        run: |
          git diff --name-only "$BASE_SHA" "$APP_SHA" -- '*.py' > "$VERIFY_DIR/changed-files.txt"
          printf '%s\n' agent/tools/env_config/env_config.py tests/test_env_config_dotenv_reload.py > "$VERIFY_DIR/expected-files.txt"
          diff "$VERIFY_DIR/expected-files.txt" "$VERIFY_DIR/changed-files.txt"
          mapfile -t files < "$VERIFY_DIR/changed-files.txt"
          ruff check "${files[@]}" --select F --ignore F403,F405 2>&1 | tee "$VERIFY_DIR/ruff.log"
      - name: Verify final application identity
        run: |
          test "$(git rev-parse HEAD)" = "$APP_SHA"
          sha256sum -c "$VERIFY_DIR/application.sha256"
          git diff --exit-code "$APP_SHA" -- .
          git diff --exit-code "$APP_SHA" "$CI_SHA" -- . ':(exclude).github/workflows/test-windows-bash.yml'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: env-reload-${{ matrix.mode }}-${{ matrix.python }}
          path: ${{ runner.temp }}/env-reload-verification
          retention-days: 7
