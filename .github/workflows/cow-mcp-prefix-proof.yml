name: CowAgent MCP prefix matched proof
on:
  push:
    branches: [validation/cow-mcp-prefix-20261021]
permissions:
  contents: read
jobs:
  matched:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        source: [c690a031947f78e1f9245fbe976ae7a14e892b7c, fa242cb34f6e8e9c490cc29e0ef9c254f1e14416]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: rudycelekli/CowAgent
          ref: ${{ matrix.source }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact source and runtime
        env:
          EXPECTED: ${{ matrix.source }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          git status --porcelain
          git rev-parse HEAD HEAD^{tree}
          sha256sum requirements.txt tests/test_mcp_tool_prefix.py agent/tools/tool_manager.py common/state_dir.py
          python --version
          cat /etc/os-release
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
      - name: Install native declared dependencies
        run: |
          python -m pip install pytest
          python -m pip install -r requirements.txt
      - name: Exact unchanged test file
        run: python -m pytest tests/test_mcp_tool_prefix.py -vv
      - name: Source guard
        if: always()
        run: git diff --exit-code && test -z "$(git status --porcelain --untracked-files=no)"
