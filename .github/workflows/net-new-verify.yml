name: CowAgent net-new exact-source verification

on:
  push:
    branches: [verify/cow-net-new-20261013]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  native:
    name: native (${{ matrix.candidate }}, ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python:
        - '3.11'
        - '3.13'
        candidate:
        - workspace-read-snapshot
        - workspace-agent-fallback
        - project-save-errors
        - root-mutable-files
        include:
        - candidate: workspace-read-snapshot
          head: 38d1a4b6e59ab28aa4213e00ef6488fbf3f2e38e
          base: 90e8c0a3e1c3e8bc0ba7d9281ca750a2225f9679
          patch_sha256: 31d9113984935f69ecb270bce7b690c4730477cc484ca57db1fb869227b3110e
          test_sha256: 20f9d8496845245a8896d880fa2fe9126ad4248cad6cc41c65120265b22ab040
          test: tests/test_workspace_read_snapshot.py
          failures:
          - test_read_metadata_belongs_to_the_returned_content
          - test_http_editor_reports_conflict_after_atomic_replacement
          healthy:
          - test_unchanged_file_keeps_the_existing_editor_round_trip
        - candidate: workspace-agent-fallback
          head: 1d6edfdd7c8fa8e0c47e0d378c1c3e60d8166415
          base: 90e8c0a3e1c3e8bc0ba7d9281ca750a2225f9679
          patch_sha256: a038cc40793a66659921cb09c72d95ddbe9e84a19ed99451617cd7e5b232306d
          test_sha256: 8e212bb13713c5955fa0336390ac030c84e95659ec3d593a18c64ef08628bb48
          test: tests/test_workspace_agent_fallback.py
          failures:
          - test_project_editor_reads_and_saves_the_requested_agents_memory[agent]
          - test_project_editor_reads_and_saves_the_requested_agents_memory[agent_id]
          - test_system_file_resolver_uses_the_requested_agent
          - test_absolute_system_path_under_the_requested_agent_remains_editable
          healthy:
          - test_project_copy_and_default_agent_controls
        - candidate: project-save-errors
          head: a4e5249876ad1c7496ae696b26c424232a3e6301
          base: 90e8c0a3e1c3e8bc0ba7d9281ca750a2225f9679
          patch_sha256: 7e7f9bc86d284eadf635264d2684641cad7917dfbefecb1f8bdfbab086871fe5
          test_sha256: d642d99fa415bbef786342b38d05f8d665052479a5be97c0d392ce2f29a596fe
          test: tests/test_project_save_errors.py
          failures:
          - test_http_selection_reports_disk_failure_and_keeps_previous_binding
          - test_failed_mutations_raise_without_leaving_partial_staging_files[select]
          - test_failed_mutations_raise_without_leaving_partial_staging_files[clear]
          - test_failed_mutations_raise_without_leaving_partial_staging_files[rename]
          - test_failed_mutations_raise_without_leaving_partial_staging_files[order]
          - test_failed_mutations_raise_without_leaving_partial_staging_files[delete]
          - test_session_preferences_failures_preserve_saved_overrides[set]
          - test_session_preferences_failures_preserve_saved_overrides[clear]
          - test_session_preferences_failures_preserve_saved_overrides[forget]
          healthy:
          - test_successful_selection_remains_persistent
          - test_unchanged_session_preferences_keep_the_existing_api
        - candidate: root-mutable-files
          head: 4ffa2b1e096e54309d94c31abe3225264a26b4ad
          base: 90e8c0a3e1c3e8bc0ba7d9281ca750a2225f9679
          patch_sha256: a9d156769c5415afada89418c4fd9b8d48411e34ec3820bf38ab8a5297f26524
          test_sha256: 5ef1e8aef258dc25e22f0a4f196dc38f206f1491e93e96deb1597114562ece82
          test: tests/test_file_serving_refresh.py
          failures:
          - test_mutable_file_requires_revalidation
          - test_repeated_url_reads_the_updated_output
          healthy:
          - test_disallowed_path_is_still_refused
          - test_missing_file_is_still_refused

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.head }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the official lint dependency
        run: python -m pip install ruff

      - name: Verify the exact source and official changed-file F gate
        env:
          CANDIDATE_HEAD: ${{ matrix.head }}
          CANDIDATE_BASE: ${{ matrix.base }}
          EXPECTED_PATCH_SHA: ${{ matrix.patch_sha256 }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_HEAD"
          git diff --exit-code
          git diff --name-only "$CANDIDATE_BASE" HEAD -- '*.py' > "$RUNNER_TEMP/changed-python.txt"
          mapfile -t files < "$RUNNER_TEMP/changed-python.txt"
          ruff check "${files[@]}" --select F --ignore F403,F405
          git diff --binary "$CANDIDATE_BASE" HEAD | sha256sum > "$RUNNER_TEMP/source.patch.sha256"
          test "$(cut -d ' ' -f1 "$RUNNER_TEMP/source.patch.sha256")" = "$EXPECTED_PATCH_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install the official native test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -r requirements.txt

      - name: Run the full official backend test suite
        env:
          CANDIDATE_HEAD: ${{ matrix.head }}
        run: |
          set +e
          python -m pytest tests/ -q --junitxml="$RUNNER_TEMP/full.xml" | tee "$RUNNER_TEMP/full.log"
          native_statuses=("${PIPESTATUS[@]}")
          set -e
          test "${native_statuses[1]}" = 0
          export NATIVE_PYTEST_EXIT="${native_statuses[0]}"
          python - <<'PY'
          """Validate native pytest results independently of the surrounding CI job."""
          
          import json
          import sys
          import xml.etree.ElementTree as ET
          
          
          def verify(path, producer_exit, actual_head, expected_head):
              if producer_exit != 0:
                  raise ValueError(f"native pytest exited {producer_exit}")
              if actual_head != expected_head:
                  raise ValueError("native tests ran against the wrong source head")
              cases = list(ET.parse(path).iter("testcase"))
              if not cases:
                  raise ValueError("native pytest produced no test cases")
              result = {
                  "tests": len(cases),
                  "failures": sum(c.find("failure") is not None for c in cases),
                  "errors": sum(c.find("error") is not None for c in cases),
                  "skipped": sum(c.find("skipped") is not None for c in cases),
              }
              if result["failures"] or result["errors"] or result["skipped"] == result["tests"]:
                  raise ValueError(f"native pytest did not pass: {result}")
              return result
          
          
          import os, pathlib, subprocess
          result = verify(
              pathlib.Path(os.environ["RUNNER_TEMP"]) / "full.xml",
              int(os.environ["NATIVE_PYTEST_EXIT"]),
              subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              os.environ["CANDIDATE_HEAD"],
          )
          pathlib.Path(os.environ["RUNNER_TEMP"], "native-result.json").write_text(json.dumps(result))
          print(json.dumps(result))
          PY
          git diff --exit-code

      - name: Run the frozen intervention against the exact base
        env:
          CANDIDATE_HEAD: ${{ matrix.head }}
          CANDIDATE_BASE: ${{ matrix.base }}
          FROZEN_TEST: ${{ matrix.test }}
          EXPECTED_TEST_SHA: ${{ matrix.test_sha256 }}
          EXPECTED_FAILURES: ${{ toJson(matrix.failures) }}
          EXPECTED_HEALTHY: ${{ toJson(matrix.healthy) }}
        run: |
          git show "$CANDIDATE_HEAD:$FROZEN_TEST" > "$RUNNER_TEMP/frozen.py"
          sha256sum "$RUNNER_TEMP/frozen.py" > "$RUNNER_TEMP/frozen.sha256"
          test "$(cut -d ' ' -f1 "$RUNNER_TEMP/frozen.sha256")" = "$EXPECTED_TEST_SHA"
          git checkout --detach "$CANDIDATE_BASE"
          cp "$RUNNER_TEMP/frozen.py" "$FROZEN_TEST"
          set +e
          python -m pytest "$FROZEN_TEST" -q --junitxml="$RUNNER_TEMP/before.xml" > "$RUNNER_TEMP/before.log" 2>&1
          baseline_exit=$?
          set -e
          cat "$RUNNER_TEMP/before.log"
          test "$baseline_exit" = 1
          python - <<'PY'
          import json, os, pathlib, xml.etree.ElementTree as ET
          cases = list(ET.parse(pathlib.Path(os.environ["RUNNER_TEMP"]) / "before.xml").iter("testcase"))
          failures = {c.attrib["name"] for c in cases if c.find("failure") is not None}
          healthy = {c.attrib["name"] for c in cases if c.find("failure") is None}
          assert not any(c.find("error") is not None or c.find("skipped") is not None for c in cases)
          assert failures == set(json.loads(os.environ["EXPECTED_FAILURES"])), failures
          assert healthy == set(json.loads(os.environ["EXPECTED_HEALTHY"])), healthy
          print(json.dumps({"failures": sorted(failures), "healthy": sorted(healthy)}))
          PY
          git diff --exit-code

      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cow-net-new-${{ matrix.candidate }}-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/native-result.json
            ${{ runner.temp }}/full.xml
            ${{ runner.temp }}/full.log
            ${{ runner.temp }}/before.xml
            ${{ runner.temp }}/before.log
            ${{ runner.temp }}/frozen.sha256
            ${{ runner.temp }}/source.patch.sha256
            ${{ runner.temp }}/changed-python.txt
