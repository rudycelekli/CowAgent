name: Fork-only Windows inline Python exact-head regression
'on':
  push:
    branches: [validation/cow-inline-python-20261021]
permissions:
  contents: read
jobs:
  qualify:
    if: github.repository == 'rudycelekli/CowAgent'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cec7433eea97477795923fa7c57e47ee63111bad
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight source import and test dependencies
        run: python -m pip install requests==2.32.5 regex PyYAML markdown-it-py json-repair numpy python-dotenv croniter chardet pytest
      - name: Record exact product and runtime
        shell: python
        run: |
          import subprocess,sys,json
          head='cec7433eea97477795923fa7c57e47ee63111bad'
          base='c690a031947f78e1f9245fbe976ae7a14e892b7c'
          assert sys.platform=='win32'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==head
          assert subprocess.check_output(['git','merge-base',base,head],text=True).strip()==base
          paths=subprocess.check_output(['git','diff','--name-only',base,head],text=True).splitlines()
          assert paths==['agent/tools/bash/bash.py','tests/test_bash_multiline_python.py'], paths
          assert not subprocess.check_output(['git','status','--porcelain'],text=True).strip()
          print(json.dumps({'product':head,'base':base,'python':sys.version,'paths':paths}))
          subprocess.run([sys.executable,'-m','pip','freeze'],check=True)
      - name: Run real Windows Bash regressions without providers
        run: python -m pytest tests/test_bash_multiline_python.py tests/test_bash_streaming.py -q --junitxml=windows-bash-result.xml
      - name: Verify native coverage and retain ordinary-log evidence
        if: always()
        shell: python
        run: |
          import pathlib,xml.etree.ElementTree as ET,subprocess
          report=pathlib.Path('windows-bash-result.xml')
          assert report.exists(), 'test collection/execution did not produce evidence'
          print('::stop-commands::cow-windows-result-end')
          print(report.read_text(encoding='utf-8'))
          print('::cow-windows-result-end::')
          cases=ET.parse(report).getroot().findall('.//testcase')
          focus=[c for c in cases if 'test_bash_multiline_python' in c.get('classname','')]
          assert len(focus)==21, len(focus)
          assert all(not list(c) for c in focus), 'new native cases must pass without skips'
          failures=[c for c in cases if c.find('failure') is not None or c.find('error') is not None]
          assert not failures
          assert not subprocess.check_output(['git','diff','--name-only'],text=True).strip()
